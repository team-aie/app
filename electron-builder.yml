appId: com.team-aie.app
productName: aie
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
directories:
  buildResources: build
  output: release
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!docs/*"
  - "!tests/*"
  - "!scripts/*"
  - "out/**/*"
extraResources:
  - from: resources/reclists
    to: reclists
  - from: resources/icon.png
    to: icon.png
# Day-1 releases are ad-hoc signed ($0) via `-c.mac.identity=- -c.mac.hardenedRuntime=false` on Apple Silicon arm64;
# CI turns on Developer ID signing + hardenedRuntime + notarization automatically when secrets exist.
mac:
  category: public.app-category.music
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: "aie needs microphone access to record vocal takes in the booth."
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: AudioVideo
  icon: build/icon.png
  maintainer: "team-aie <yi.iluminar@gmail.com>"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
publish:
  provider: github
  owner: team-aie
  repo: app
