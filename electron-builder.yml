appId: com.team-aie.app
productName: aie
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
directories:
  buildResources: build
  output: release
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!docs/*"
  - "!tests/*"
  - "!scripts/*"
  - "out/**/*"
extraResources:
  - from: resources/reclists
    to: reclists
# Day-1 releases are unsigned ($0): CI turns on signing / notarization only when secrets exist
# (`-c.mac.identity=null` / `-c.mac.notarize=true` are passed from release.yml).
mac:
  category: public.app-category.music
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: AudioVideo
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
publish:
  provider: github
  owner: team-aie
  repo: app
